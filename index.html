<style>
/* ===== Estilo igual que TPV Factu (azul petróleo, Epilogue) ===== */
:root{
  --c:#1b7f95; --bg:#f4f9fb;
  --paper:var(--bg); --card:#fff; --ink:var(--c); --text:#292524; --muted:#78716c;
  --line:#e7e5e4; --inpline:#d6d3d1; --inpbg:#fff; --soft:#e7e5e4; --softhover:#d6d3d1;
  --stamp:#b91c1c; --stampbg:#fee2e2; --warn:#92400e; --warnbg:#fef3c7; --warnline:#fcd34d;
  --ok:#15803d; --okbg:#dcfce7; --tag:#fef3c7; --tagink:#92400e; --accent:var(--c); --onc:#fff;
  --nav:var(--c);
  color-scheme:light;
}
html.dark{
  --c:#4fc3d8; --bg:#10242c;
  --card:#132c36; --text:#fff; --muted:#aab9bf; --line:#27667a; --inpline:#27667a; --inpbg:#0c1d24;
  --soft:#1f4756; --softhover:#2a6f83;
  --stamp:#ff9db5; --stampbg:#4a1f2b; --warn:#f3c969; --warnbg:#3a3217; --warnline:#b8923a;
  --ok:#7be0a8; --okbg:#173a2a; --tag:#3a3217; --tagink:#f3c969; --onc:#08222b;
  --nav:linear-gradient(90deg,#124f61,#1f7a90);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Epilogue,system-ui,sans-serif;padding-bottom:1.5rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1b7f95}
html.dark body::before{background:#124f61}
h1,h2,h3{font-family:Epilogue,system-ui,sans-serif;color:var(--text);margin:0;line-height:1.2;font-weight:800}
h1{font-size:1.25rem}
h2{font-size:1.15rem;margin:1.5rem 0 .6rem}
h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
a{color:var(--c)}
/* Barra superior con pestañas (como TPV Factu) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--nav);color:#fff;display:flex;align-items:center;gap:.25rem;padding:.5rem;overflow-x:auto;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.tabsbar{display:flex;gap:.25rem}
.tabsbar button,.navbtn{padding:.5rem .75rem;border-radius:.75rem;font-size:.875rem;font-weight:700;white-space:nowrap;border:0;cursor:pointer;background:rgba(0,0,0,.25);color:#fff}
.tabsbar button.on{background:#fff;color:#1b7f95}
html.dark .tabsbar button.on{background:var(--c);color:#08222b}
.top .badge{margin-left:auto;flex:none}
.top .navbtn{flex:none}
.wrap{max-width:42rem;margin:0 auto;padding:.25rem 1rem 0}
.mono{font-family:'Space Mono',monospace}
.note{font-size:.85rem;color:var(--muted);margin:.4rem 0}
.banner{border-radius:1rem;padding:.8rem 1rem;margin:.8rem 0;font-size:.9rem;border:1px solid transparent}
.banner.info{background:var(--card);border-color:var(--line)}
.banner.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warnline)}
.banner.stamp{background:var(--stampbg);color:var(--stamp)}
/* Botones (como .btn de TPV Factu) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:0;background:var(--soft);color:var(--text);border-radius:.9rem;padding:.7rem 1rem;font-weight:800;font-size:.85rem;cursor:pointer;min-height:44px}
.btn:active{background:var(--softhover)}
.btn.solid{background:var(--c);color:var(--onc)}
.btn.danger{background:var(--stampbg);color:var(--stamp)}
.btn.small{min-height:36px;padding:.45rem .8rem;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.tabsbar button:focus-visible,.navbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.scanbig{display:flex;flex-direction:column;align-items:flex-start;gap:.25rem;width:100%;text-align:left;background:var(--c);color:var(--onc);border:0;border-radius:1rem;padding:1.1rem 1.1rem 1rem;cursor:pointer;margin-top:1rem}
.scanbig b{font-size:1.25rem;font-weight:800}
.scanbig span{opacity:.9;font-size:.88rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.8rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:.75rem 1rem}
.stat .n{font-family:'Space Mono',monospace;font-size:1.2rem;font-weight:700;color:var(--c)}
.stat .l{font-size:.8rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:.5rem}
.item{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:.75rem 1rem;cursor:pointer;text-align:left;width:100%;color:var(--text)}
.item .t{font-weight:800}
.item .m{font-size:.85rem;color:var(--muted)}
.lote{display:inline-block;background:var(--tag);color:var(--tagink);font-weight:700;border-radius:.4rem;padding:0 .4rem;font-size:.8rem;font-family:'Space Mono',monospace}
.badge{display:inline-block;border-radius:999px;padding:.1rem .55rem;font-size:.75rem;font-weight:700;white-space:nowrap}
.badge.red{background:var(--stampbg);color:var(--stamp)}
.badge.amber{background:var(--warnbg);color:var(--warn)}
.badge.green{background:var(--okbg);color:var(--ok)}
.badge.grey{background:var(--soft);color:var(--muted)}
.season{display:flex;gap:.8rem;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--warn);border-radius:1rem;padding:.7rem .9rem;margin:.5rem 0}
.season.now{border-left-color:var(--ok)}
.season .d{font-family:'Space Mono',monospace;font-weight:700;font-size:1.4rem;color:var(--c);min-width:3.2rem;text-align:center;line-height:1}
.season .d small{display:block;font-family:Epilogue,sans-serif;font-size:.7rem;font-weight:600;color:var(--muted)}
/* Chips (como .chip de TPV Factu) */
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}
.chip{padding:.45rem .9rem;border-radius:.8rem;font-weight:700;font-size:.8rem;background:var(--card);border:1px solid var(--line);white-space:nowrap;cursor:pointer;color:var(--text)}
.chip.on{background:var(--c);color:var(--onc);border-color:var(--c)}
/* Campos (como .inp de TPV Factu) */
.field{display:flex;flex-direction:column;gap:.1rem;margin:.45rem 0;min-width:0}
.field label{font-size:.75rem;font-weight:700;color:var(--text)}
.field input,.field select,.field textarea{width:100%;margin-top:.15rem;padding:.6rem;border:1px solid var(--inpline);border-radius:.7rem;font-size:.95rem;background:var(--inpbg);color:var(--text);min-height:42px}
::placeholder{color:#a8a29e}
html.dark ::placeholder{color:#7f9aa3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 .5rem}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 .5rem}
.line{border:1px solid var(--line);border-radius:1rem;padding:.5rem .75rem .7rem;margin:.6rem 0;background:var(--bg)}
.line .head{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted);font-weight:700}
.thumbs{display:flex;gap:.5rem;overflow-x:auto;padding:.3rem 0}
.thumbs img{height:110px;border-radius:.7rem;border:1px solid var(--line);cursor:pointer;object-fit:cover}
.thumbs .pg{display:flex;flex-direction:column;align-items:center;gap:.3rem;flex:none}
.recorte{position:fixed;inset:0;z-index:45;background:#0c1d24;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.recorte .zona{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:.6rem}
.recorte canvas{touch-action:none;max-width:100%;max-height:100%}
.recorte .barra{display:flex;gap:.5rem;flex-wrap:wrap;padding:.6rem .8rem;background:#132c36}
.recorte .barra .btn{background:#1f4756;color:#fff;flex:1 1 auto}
.recorte .barra .btn.solid{background:#4fc3d8;color:#08222b}
.recorte p{color:#cfe3e8;margin:.5rem .8rem 0;font-size:.9rem}
.envase{display:flex;gap:.6rem;align-items:center;margin-top:.4rem}
.envase img{width:56px;height:56px;object-fit:cover;border-radius:.5rem;border:1px solid var(--line)}
.bars{display:flex;flex-direction:column;gap:.45rem}
.bar .lab{display:flex;justify-content:space-between;font-size:.85rem}
.bar .lab b{font-family:'Space Mono',monospace}
.bar .track{height:10px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:.15rem}
.bar .fill{height:100%;background:var(--c);border-radius:999px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:1rem;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:.5rem .6rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:.75rem;font-weight:700}
td.num,th.num{text-align:right}
td.num{font-family:'Space Mono',monospace;font-size:.8rem}
tr:last-child td{border-bottom:0}
/* Secciones desplegables de Informes */
details.seccion{background:var(--card);border:1px solid var(--line);border-radius:1rem;margin:.6rem 0;overflow:hidden}
details.seccion>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.6rem;padding:.85rem 1rem;font-weight:800}
details.seccion>summary::-webkit-details-marker{display:none}
details.seccion>summary .st{flex:1;font-size:1rem}
details.seccion>summary .sr{font-size:.8rem;font-weight:600;color:var(--muted);white-space:nowrap}
details.seccion>summary::after{content:"";width:.55rem;height:.55rem;border-right:2.5px solid var(--c);border-bottom:2.5px solid var(--c);transform:rotate(45deg);margin:0 .2rem .25rem .3rem;transition:transform .15s}
details.seccion[open]>summary::after{transform:rotate(-135deg);margin-bottom:-.15rem}
details.seccion>.sc{padding:0 .75rem .9rem}
details.seccion .tablewrap{border-radius:.8rem}
/* Ventanas: centradas como los modales de TPV Factu */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:1rem}
.sheet.hidden{display:none}
.sheet-card{background:var(--card);color:var(--text);width:100%;max-width:26rem;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:1rem;padding:1.25rem}
.sheet-card h2{font-size:1.1rem}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.5rem}
.x{background:none;border:0;font-size:1.6rem;line-height:1;color:var(--muted);cursor:pointer;padding:.2rem .5rem}
.busy{display:flex;gap:.7rem;align-items:center;padding:1rem;background:var(--card);border:1px solid var(--line);border-radius:1rem;margin:.8rem 0}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--c);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
/* Aviso abajo, como TPV Factu */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);transform:translateX(-50%);background:#000;color:#fff;padding:.5rem 1rem;border-radius:.75rem;font-size:.875rem;z-index:60;max-width:90vw;text-align:center;display:none}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}
.foot{margin:2rem 0 1rem;display:flex;gap:.5rem;flex-wrap:wrap}
.viewer{position:fixed;inset:0;z-index:70;background:#000;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.viewer button{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;background:#fff;color:#000;border:0;border-radius:999px;width:44px;height:44px;font-size:1.4rem}
</style>
<script>
/* Tema claro / oscuro / automático, como en TPV Factu (se aplica antes de pintar) */
function aplicarTema(){
  var t = localStorage.getItem('tema') || 'claro', os = !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches), dark = t === 'oscuro' || (t === 'auto' && os);
  document.documentElement.classList.toggle('dark', dark);
  var m = document.querySelector('meta[name=theme-color]'); if (m) m.setAttribute('content', dark ? '#124f61' : '#1b7f95');
}
aplicarTema();
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ if ((localStorage.getItem('tema') || 'claro') === 'auto') aplicarTema(); });
</script>

<script>
/* Si algo impide arrancar la app, se muestra el motivo en pantalla en vez de quedarse en blanco */
window.mostrarFallo = function(m){
  var a = document.getElementById('app'); if (!a) return;
  a.innerHTML = '<div style="margin:1rem 0;padding:1rem;border-radius:12px;background:#FBE9E7;color:#C2362B;font-size:.95rem"><b>La app no ha podido arrancar.</b><br>Haz una captura de esta pantalla y envíasela a Claude.<br><br><code style="word-break:break-all;color:#22263A">' + String(m).replace(/</g,'&lt;') + '</code><br><br><button onclick="location.reload()" style="padding:.6rem 1rem;border-radius:10px;border:1.5px solid #C2362B;background:#fff;color:#C2362B;font-weight:700">Reintentar</button></div>';
};
window.addEventListener('load', function(){
  if (window.APP_OK) return;
  var d = document.createElement('div');
  d.style.cssText = 'margin:1rem;padding:1rem;border-radius:12px;background:#FBE9E7;color:#C2362B;font:15px/1.5 system-ui,sans-serif';
  d.innerHTML = '<b>La app se ha descargado incompleta.</b><br>El archivo index.html publicado en GitHub está cortado. Vuelve a descargar index.html del chat de Claude y súbelo otra vez al repositorio «trazabilidad».<br><br><button onclick="location.reload()" style="padding:.6rem 1rem;border-radius:10px;border:1.5px solid #C2362B;background:#fff;color:#C2362B;font-weight:700">Reintentar</button>';
  document.body.appendChild(d);
});
window.addEventListener('error', function(e){ var a = document.getElementById('app'); if (a && !a.children.length) window.mostrarFallo((e.message || 'Error') + (e.lineno ? ' (línea ' + e.lineno + ')' : '')); });
</script>

<header class="top" id="nav">
  <div class="tabsbar" id="tabs"></div>
  <button class="navbtn" onclick="abrirAjustes()">Ajustes</button>
  <span id="sync" class="badge grey" style="display:none"></span>

<main class="wrap" id="app"></main>

<div id="toast"></div>

<script>
/* ===== Utilidades ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
function num(v){
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  let s = String(v).replace(/[^\d,.\-]/g, '');
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(',', '.');
  const n = parseFloat(s); return isFinite(n) ? n : null;
}
const money = n => n == null ? '—' : n.toLocaleString('es-ES', {style:'currency', currency:'EUR'});
const qty = n => n == null ? '—' : (Math.round(n * 100) / 100).toLocaleString('es-ES');
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const pd = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const validIso = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
const fdate = s => validIso(s) ? s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4) : '—';
const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const diffDays = (a, b) => Math.round((b - a) / 86400000);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function toast(msg, ms = 3500){ const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms); }

/* ===== Datos (guardados en el propio móvil) ===== */
const APP_VERSION = '4.6';
const COLS = ['proveedores','documentos','ventas','temporada','equivalencias','ingredientes','reglas'];
const S = {proveedores:{}, documentos:{}, ventas:{}, temporada:{}, equivalencias:{}, ingredientes:{}, reglas:{}};
let pendingRender = false, LISTO = false;
const IDB = {
  db:null,
  open(){ return new Promise((res, rej) => {
    const r = indexedDB.open('trazabilidad', 3);
    r.onupgradeneeded = () => { const d = r.result; [...COLS, 'fotos'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
    r.onblocked = () => toast('Cierra las demás ventanas o pestañas de Trazabilidad y vuelve a abrir la app.', 8000);
    r.onsuccess = () => { this.db = r.result; this.db.onversionchange = () => { try { this.db.close(); } catch(e){} location.reload(); }; res(); }; r.onerror = () => rej(r.error);
  }); },
  run(store, mode, fn){ return new Promise((res, rej) => {
    const t = this.db.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }); },
  put(st, k, v){ return this.run(st, 'readwrite', s => s.put(v, k)); },
  del(st, k){ return this.run(st, 'readwrite', s => s.delete(k)); },
  get(st, k){ return this.run(st, 'readonly', s => s.get(k)); },
  all(st){ return new Promise((res, rej) => {
    const o = {}; const t = this.db.transaction(st, 'readonly'); const c = t.objectStore(st).openCursor();
    c.onsuccess = () => { const cur = c.result; if (cur){ o[cur.key] = cur.value; cur.continue(); } };
    t.oncomplete = () => res(o); t.onerror = () => rej(t.error);
  }); }
};
const Store = {
  async init(){
    try {
      await IDB.open();
      for (const c of COLS) S[c] = await IDB.all(c);
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    } catch(e){ toast('No se pudo abrir el almacenamiento del móvil: ' + (e && e.message || 'error'), 6000); }
    LISTO = true; render();
    fbInit();
  },
  async save(c, id, data){
    data = JSON.parse(JSON.stringify(data));
    S[c][id] = data; await IDB.put(c, id, data); render();
    if (fbActivo()) FB.mod.setDoc(FB.mod.doc(fbCol(c), id), data).catch(e => { addPend(c, id); fbError(e); });
    else if (leerCfg()) addPend(c, id);
  },
  async del(c, id){
    delete S[c][id]; await IDB.del(c, id); render();
    if (fbActivo()) FB.mod.deleteDoc(FB.mod.doc(fbCol(c), id)).catch(e => { addPend(c, id); fbError(e); });
    else if (leerCfg()) addPend(c, id);
  }
};

/* ===== Sincronización con Firebase (cuenta de Google) ===== */
const FBV = '10.12.2';
const FB = {cfg:null, mod:null, app:null, auth:null, db:null, user:null, unsubs:[], estado:'off', error:'', primeros:null, sincronizando:false};
const fbActivo = () => FB.estado === 'conectado' && !!FB.db;
function leerCfg(){ try { return JSON.parse(localStorage.getItem('fb_cfg') || 'null'); } catch(e){ return null; } }
function parseCfg(t){
  const o = {}; String(t || '').replace(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g, (m, k, v) => { o[k] = v; return m; });
  if (!o.apiKey || !o.projectId || !o.appId) return null;
  return {apiKey:o.apiKey, authDomain:o.authDomain || (o.projectId + '.firebaseapp.com'), projectId:o.projectId, storageBucket:o.storageBucket || '', messagingSenderId:o.messagingSenderId || '', appId:o.appId};
}
function leerPend(){ try { return new Set(JSON.parse(localStorage.getItem('fb_pend') || '[]')); } catch(e){ return new Set(); } }
function addPend(c, id){ const p = leerPend(); p.add(c + '/' + id); localStorage.setItem('fb_pend', JSON.stringify([...p])); }
function fbCol(c){ return FB.mod.collection(FB.db, 'negocios', 'lapiruleta', c); }
function fbError(e){
  const code = e && e.code || '';
  if (code === 'permission-denied') FB.error = 'Tu cuenta' + (FB.user ? ' (' + FB.user.email + ')' : '') + ' no tiene permiso. Revisa las reglas de Firestore.';

    let subidos = 0;

      let enNube;

      catch(e){ if (e && e.code === 'permission-denied') throw e; FB.sincronizando = false; pintaSync(); return; }

        await FB.mod.setDoc(FB.mod.doc(fbCol(c), id), JSON.parse(JSON.stringify(S[c][id]))); subidos++;

}

    const p = pos(e); let best = -1, bd = 1e9;

function easter(y){

function estadoTemp(t){

/* ===== Facturas en PDF: cada página se convierte en imagen (ya viene recta y limpia) ===== */
const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js', PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const BLOBS_PDF = new WeakSet();
async function pdfAImagenes(file){
  await cargarScript(PDFJS_URL); const L = window.pdfjsLib; L.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const doc = await L.getDocument({data:await file.arrayBuffer()}).promise;
  const out = [], n = Math.min(doc.numPages, 20);
  for (let i = 1; i <= n; i++){
    const pg = await doc.getPage(i), v1 = pg.getViewport({scale:1}), vp = pg.getViewport({scale:Math.min(3, 1800 / Math.max(v1.width, v1.height))});
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    await pg.render({canvasContext:x, viewport:vp}).promise;
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85)); BLOBS_PDF.add(b); out.push(b);
  }
  if (doc.numPages > 20) toast('El PDF tiene ' + doc.numPages + ' páginas: se han añadido las 20 primeras.', 6000);
  return out;
}
async function addPDF(){
  const files = await pickFiles({accept:'application/pdf,.pdf', multiple:true}); if (!files.length) return;
  toast('Abriendo PDF…', 6000); let n = 0;
  for (const f of files){
    try { const bs = await pdfAImagenes(f); bs.forEach(b => PAGINAS.push({blob:b, url:URL.createObjectURL(b), pdf:true})); n += bs.length; }
    catch(e){ toast('No se pudo abrir «' + f.name + '»' + (e && /password/i.test(e.name + e.message) ? ': tiene contraseña.' : '. Comprueba que es un PDF y que hay internet.'), 7000); }
  }
  if (n) toast(n + ' página' + (n === 1 ? '' : 's') + ' añadida' + (n === 1 ? '' : 's') + ' desde PDF');
  render();
}
async function addPagina(camera){

}

let LOTE = null;
const TANDA = 6; // fotos por consulta a Gemini
async function leerLote(){
  if (PAGINAS.length < 2 || LEYENDO) return;
  if (!hasKey()){ toast(errMsg({code:'no_key'}), 5000); return abrirAjustes(); }
  if (LOTE && LOTE.items.some(it => it.estado === 'pendiente') && !confirm('Tienes documentos leídos sin guardar. Si sigues, se perderán. ¿Continuar?')) return;
  const fotos = PAGINAS.map(p => p.blob);
  const tandas = []; for (let i = 0; i < fotos.length; i += TANDA) tandas.push(fotos.slice(i, i + TANDA));
  LEYENDO = true; const items = [];
  try {
    for (let t = 0; t < tandas.length; t++){
      LEYENDO_TXT = 'Leyendo ' + fotos.length + ' fotos' + (tandas.length > 1 ? ' (parte ' + (t + 1) + ' de ' + tandas.length + ')' : '') + '… puede tardar uno o dos minutos.';
      render();
      const r = await askJSON(promptLote(tandas[t].length), tandas[t], true);
      LEYENDO_TXT = 'Recortando las páginas' + (tandas.length > 1 ? ' (parte ' + (t + 1) + ' de ' + tandas.length + ')' : '') + '…'; render();
      const rec = await aplicarRecortes(tandas[t], r && r.recortes);
      const docs = (r && Array.isArray(r.documentos)) ? r.documentos : [];
      const usadas = new Set();
      docs.forEach(dd => {
        const pags = (Array.isArray(dd.paginas) ? dd.paginas : []).map(n => parseInt(n, 10) - 1).filter(n => n >= 0 && n < tandas[t].length && !usadas.has(n));
        pags.forEach(n => usadas.add(n));
        if (!pags.length && !(dd.lineas || []).length && !dd.numero) return;

  // Proveedor común: el más repetido entre los documentos leídos
  const cuenta = {};
  items.forEach(it => { const d = it.draft; const k = d.proveedorId && d.proveedorId !== '__new' ? 'id:' + d.proveedorId : (d.proveedorNuevo ? 'n:' + norm(d.proveedorNuevo) : ''); if (k){ cuenta[k] = (cuenta[k] || 0) + 1; } });

/* ===== PDF por proveedor y mes ===== */
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const JSZIP_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
function cargarScript(url){
  return new Promise((res, rej) => {
    if (document.querySelector('script[src="' + url + '"]')) return res();
    const s = document.createElement('script'); s.src = url; s.onload = () => res(); s.onerror = () => { s.remove(); rej(new Error('No se pudo cargar el generador de PDF. Comprueba internet.')); };
    document.head.appendChild(s);
  });
}
let PDFMES = '', PDFTIPO = 'todos';
const nombreMes = m => { const [y, mm] = m.split('-').map(Number); const t = new Date(y, mm - 1, 1).toLocaleDateString('es-ES', {month:'long', year:'numeric'}); return t.charAt(0).toUpperCase() + t.slice(1); };
const mesesConDocs = provId => [...new Set(Object.values(S.documentos).filter(d => validIso(d.fecha) && (!provId || d.proveedorId === provId)).map(d => d.fecha.slice(0, 7)))].sort().reverse();
const eurPDF = n => n == null ? '-' : n.toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' EUR';
const limpioArchivo = t => norm(t).replace(/ /g, '_').slice(0, 40) || 'proveedor';
function docsDelMes(mes, provId, tipo){
  return Object.entries(S.documentos).map(([id, d]) => ({id, ...d}))
    .filter(d => (d.fecha || '').slice(0, 7) === mes && (!provId || d.proveedorId === provId) && (tipo === 'todos' || (d.tipo || 'factura') === tipo))
    .sort((a, b) => provName(a.proveedorId).localeCompare(provName(b.proveedorId)) || (a.fecha || '').localeCompare(b.fecha || '') || String(a.numero || '').localeCompare(String(b.numero || '')));
}
async function crearPDF(docs, titulo, sub){
  await cargarScript(JSPDF_URL);
  const {jsPDF} = window.jspdf; const pdf = new jsPDF({unit:'mm', format:'a4', compress:true});
  const PW = 210, PH = 297, M = 10;
  // Índice: calcula en qué página empieza cada documento
  const filas = []; let porProv = {}, total = 0;
  docs.forEach(d => { const pv = provName(d.proveedorId); (porProv[pv] = porProv[pv] || []).push(d); });
  Object.keys(porProv).forEach(pv => { filas.push({prov:pv}); porProv[pv].forEach(d => filas.push({d})); filas.push({sub:pv}); });
  const POR_PAG = 36, pagsIndice = Math.max(1, Math.ceil((filas.length + 3) / POR_PAG));
  let pag = pagsIndice + 1; const inicio = {};
  docs.forEach(d => { inicio[d.id] = pag; pag += Math.max(1, (d.fotos || []).length); });
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(16); pdf.text(titulo, M, 18);
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10); pdf.text(sub, M, 25);
  let y = 34, n = 0;
  const salto = () => { n++; y += 6.2; if (y > PH - 14){ pdf.addPage(); y = 18; } };
  filas.forEach(f => {
    if (f.prov){ pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11); pdf.text(f.prov, M, y); salto(); }
    else if (f.d){ const d = f.d, t = docTotal(d); total += t;
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(10);
      pdf.text((d.tipo === 'albaran' ? 'Albarán ' : 'Factura ') + (d.numero || 's/n'), M + 4, y);
      pdf.text(fdate(d.fecha), M + 82, y); pdf.text(eurPDF(t), M + 150, y, {align:'right'}); pdf.text('pág. ' + inicio[d.id], PW - M, y, {align:'right'}); salto(); }
    else { const st = porProv[f.sub].reduce((a, d) => a + docTotal(d), 0); pdf.setFont('helvetica', 'italic'); pdf.setFontSize(9); pdf.text('Total ' + f.sub + ': ' + eurPDF(st), M + 150, y, {align:'right'}); y += 3; salto(); }
  });
  pdf.setFont('helvetica', 'bold'); pdf.setFontSize(11); pdf.text(docs.length + ' documento' + (docs.length === 1 ? '' : 's') + ' · Total: ' + eurPDF(total), M, y + 4);
  while (pdf.getNumberOfPages() < pagsIndice) pdf.addPage();
  // Páginas de cada documento
  for (let k = 0; k < docs.length; k++){
    const d = docs[k]; const cab = provName(d.proveedorId) + ' · ' + (d.tipo === 'albaran' ? 'Albarán ' : 'Factura ') + (d.numero || 's/n') + ' · ' + fdate(d.fecha) + ' · ' + eurPDF(docTotal(d));
    const fotos = d.fotos || [];
    if (k % 3 === 0) toast('Creando PDF… ' + (k + 1) + ' de ' + docs.length, 3000);
    if (!fotos.length){
      pdf.addPage(); pdf.setFont('helvetica', 'bold'); pdf.setFontSize(10); pdf.text(cab, M, 12);
      pdf.setFont('helvetica', 'normal'); pdf.text('(Documento sin foto. Productos registrados:)', M, 22);
      let yy = 30; (d.lineas || []).forEach(l => { if (yy > PH - 12) return; pdf.text('- ' + l.producto + (l.cantidad != null ? ' x ' + qty(l.cantidad) + ' ' + (l.unidad || '') : '') + (lineImporte(l) != null ? ' = ' + eurPDF(lineImporte(l)) : ''), M, yy); yy += 6; });
      continue;
    }
    for (let i = 0; i < fotos.length; i++){
      pdf.addPage(); pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8.5);
      pdf.text(cab + (fotos.length > 1 ? ' · página ' + (i + 1) + ' de ' + fotos.length : ''), M, 8);
      const b = await getFotoBlob(fotos[i]);
      if (!b){ pdf.setFontSize(11); pdf.text('Foto no disponible en este móvil', M, 30); continue; }
      const img = await loadImg(b); const url = await blobToDataURL(b.type === 'image/jpeg' ? b : await compress(b, 2000, 0.85));
      const bw = PW - 2 * M, bh = PH - 12 - M, r = Math.min(bw / img.width, bh / img.height);
      const w = img.width * r, h = img.height * r;
      pdf.addImage(url, 'JPEG', M + (bw - w) / 2, 12, w, h, undefined, 'FAST');
    }
  }
  return pdf.output('blob');
}
let ARCHIVO = null;
function entregarArchivo(blob, nombre){
  ARCHIVO = {blob, nombre};
  let puede = false; try { puede = !!(navigator.canShare && navigator.canShare({files:[new File([blob], nombre, {type:blob.type})]})); } catch(e){}

    <p class="note">${puede ? 'Con «Compartir» puedes guardarlo directamente en Google Drive o enviarlo por WhatsApp o correo. ' : ''}«Descargar» lo guarda en la carpeta Descargas del móvil.</p>`);
}
function descargarArchivo(){ if (!ARCHIVO) return; descargarBlob(ARCHIVO.nombre, ARCHIVO.blob); toast('Descargando ' + ARCHIVO.nombre); }
async function compartirArchivo(){

let HACIENDO_PDF = false;
async function exportarPDF(modo, provId, mes){
  if (HACIENDO_PDF) return toast('Ya se está creando un PDF, espera.');
  mes = mes || ($('#pdfMes') && $('#pdfMes').value) || PDFMES; if (!mes) return toast('Elige el mes');

  const etiqueta = {todos:'Facturas y albaranes', factura:'Facturas', albaran:'Albaranes'}[tipo];
  try {
    if (modo === 'zip'){
      await cargarScript(JSZIP_URL); const zip = new window.JSZip();

      }

    } else {
      const titulo = provId ? provName(provId) : 'La Piruleta Café Pan · ' + etiqueta;

    }
  } catch(e){ toast((e && e.message) || 'No se pudo crear el PDF', 6000); }
  HACIENDO_PDF = false;
}

/* ===== Vista: Informes ===== */
let PERIODO = 90;
function desdePeriodo(){ return PERIODO ? iso(addDays(today0(), -PERIODO)) : ''; }
function aggCompras(desde){
  const map = {}, porProv = {}; let total = 0;
  for (const d of Object.values(S.documentos)){
    if (desde && (d.fecha || '') < desde) continue;
    const pv = provName(d.proveedorId); const t = docTotal(d); total += t; porProv[pv] = (porProv[pv] || 0) + t;
    (d.lineas || []).forEach(l => {
      const k = norm(l.producto); if (!k || l.deAlbaran) return;
      const m = map[k] || (map[k] = {nombre:l.producto, veces:0, cantidad:0, unidad:l.unidad || '', gasto:0, fechas:new Set()});
      m.veces++; m.cantidad += l.cantidad || 0; m.gasto += lineImporte(l) || 0; if (d.fecha) m.fechas.add(d.fecha);
    });
  }
  const prods = Object.values(map).map(m => {
    const f = [...m.fechas].sort(); let frec = f.length <= 1 ? (f.length ? '1 compra' : '—') : 'cada ' + Math.max(1, Math.round(diffDays(pd(f[0]), pd(f[f.length - 1])) / (f.length - 1))) + ' días';
    return {...m, frec};
  });
  return {total, porProv, prods};
}
function aggVentas(desde){
  const map = {}, diasSet = new Set(); let total = 0;
  for (const v of Object.values(S.ventas)){
    if (desde && (v.hasta || '') < desde) continue;
    for (let d = pd(v.desde), k = 0; d <= pd(v.hasta) && k < 400; d = addDays(d, 1), k++) diasSet.add(iso(d));
    (v.items || []).forEach(it => {
      const k = norm(it.producto); if (!k) return;
      const m = map[k] || (map[k] = {key:k, nombre:it.producto, cantidad:0, importe:0});
      m.cantidad += it.cantidad || 0; m.importe += it.importe || 0; total += it.importe || 0;
    });
  }
  const dias = diasSet.size;
  const prods = Object.values(map).map(m => { const pdia = dias ? m.cantidad / dias : 0; return {...m, frec: pdia >= 1 ? qty(pdia) + ' al día' : qty(pdia * 7) + ' a la semana'}; });
  return {dias, total, prods};
}

  let h = `<h2>Informes</h2><div class="chips">${[[30,'30 días'],[90,'3 meses'],[365,'12 meses'],[0,'Todo']].map(([k, l]) => `<button class="chip ${PERIODO === k ? 'on' : ''}" onclick="PERIODO=${k};render()">${l}</button>`).join('')}</div>`;

function promptRecetas(texto, arts, compras, ings){
  return `Eres experto en escandallos de una cafetería-panadería en España (La Piruleta). Casi no compra materias primas: compra bollería y pan ya hechos, café, leche, refrescos… y prepara tostadas y menús.
El dueño explica cómo hace sus productos:
"""${texto}"""
ARTÍCULOS QUE VENDE EN EL TPV (nombres exactos): ${JSON.stringify(arts)}
PRODUCTOS QUE COMPRA (como aparecen en albaranes, con su unidad): ${JSON.stringify(compras)}
INGREDIENTES QUE YA TIENE: ${JSON.stringify(ings)}
Crea los ingredientes y las reglas que describe. Responde SOLO con un objeto JSON:
{"ingredientes":[{"nombre":string,"unidad":string,"alias":[{"palabras":string,"unidad":string|null,"factor":number|null}]}],"reglas":[{"alguna":[string],"todas":[string],"ninguna":[string],"ingrediente":string,"cantidad":number,"nota":string}]}
Cómo funcionan las reglas:
- Una regla se aplica a un artículo del TPV si su nombre contiene AL MENOS UNA palabra o frase de "alguna" (si no está vacía), TODAS las de "todas" y NINGUNA de "ninguna". Se comparan palabras enteras, sin tildes ni mayúsculas: "media" NO coincide con "mediterraneo", pero "medio menu" sí coincide con "Medio menú serrano".
- Si a un artículo le aplican varias reglas, se SUMAN (pan + jamón + aceite). Por eso las reglas del mismo ingrediente deben excluirse entre sí con "ninguna" para no contar dos veces (por ejemplo, la regla de ración entera debe excluir "media" y "medio").
- "cantidad" es lo que gasta 1 unidad vendida, en la unidad del ingrediente (media chapata = 0.5, un cuarto = 0.25). Para artículos que se venden al peso (kg) con un ingrediente controlado en kg, cantidad 1.
- Escribe las palabras sin tildes y en minúsculas. Comprueba con la lista del TPV que cada regla atrapa los artículos correctos y no otros.
Cómo funcionan los ingredientes:
- "unidad": unidad de control (ud, kg, l, loncha…).
- "alias": palabras que aparecen en el nombre del producto en los albaranes para reconocerlo (por ejemplo "palmeritas"). "unidad": unidad del albarán a la que se refiere el factor, o null. "factor": cuántas unidades del ingrediente trae 1 unidad del albarán (1 caja de 40 chapatas → 40; producto comprado por kg y controlado en kg → 1). Si no se sabe, null.
- Si un ingrediente ya existe con el mismo nombre, usa ese nombre exacto.
- No inventes cantidades que no se deduzcan de la explicación o de los nombres; deja null lo que no sepas.`;
}

    let nIng = 0, nReg = 0;
    for (const gi of ((r && r.ingredientes) || [])){

      if (porNombre[k]){

        const nuevos = alias.filter(a => !ya.has(norm(a.palabras) + '|' + norm(a.unidad)));
        if (nuevos.length){ g.alias = [...(g.alias || []), ...nuevos]; g.actualizado = Date.now(); await Store.save('ingredientes', id, g); }
      } else { const id = uid(); porNombre[k] = id; await Store.save('ingredientes', id, {nombre:String(gi.nombre), unidad:gi.unidad || 'ud', alias, actualizado:Date.now()}); nIng++; }
    }

      if (!reg.alguna.length && !reg.todas.length) continue; const f = firma(reg); if (ya.has(f)) continue; ya.add(f);

    }
    toast('Creados ' + nIng + ' ingredientes y ' + nReg + ' reglas. Revísalo en «Comprobar».', 6000);
    verRecetas('comprobar');
  } catch(e){ if (b.isConnected){ b.disabled = false; b.textContent = 'Crear recetas con Gemini'; } toast(errMsg(e), 6000); }
}

        if (!compras.length && !q.sinCompra) continue;

  } catch(e){ toast(errMsg(e), 6000); }

}
function promptEquiv(tpv, compras){
  return `Eres el asistente de una cafetería-panadería en España (La Piruleta). Casi no compra materias primas: compra bollería congelada y artesana ya terminada (solo hornear, decorar o descongelar), hace tostadas, y compra café en grano por kilos, Colacao, leche, zumos, batidos, refrescos y cervezas.

A) ARTÍCULOS QUE SE VENDEN en el TPV: ${JSON.stringify(tpv)}
B) PRODUCTOS QUE SE COMPRAN a proveedores, con su unidad de compra: ${JSON.stringify(compras)}
Para cada artículo de la lista A, indica qué producto o productos de la lista B se gastan al venderlo y su "rendimiento": cuántas unidades del artículo vendido salen de 1 unidad de compra. Ejemplos: 1 kg de café en grano da unas 140 tazas → 140; una caja de 60 napolitanas → 60; una lata de refresco comprada por unidades → 1; un café con leche gasta café (140 por kg) y leche (unos 6 por litro).
Si la unidad de compra es caja o paquete y no sabes cuántas unidades trae, mira si el nombre lo indica; si no, estima y pon "estimado":true.
Responde SOLO con un objeto JSON: {"equivalencias":[{"tpv":string (copiado exacto de la lista A),"compras":[{"producto":string (copiado exacto de la lista B),"rendimiento":number,"estimado":boolean}],"sinCompra":boolean}]}
Reglas:
- Si un artículo no se corresponde con ningún producto comprado, pon "compras":[] y "sinCompra":true. Si dudas mucho, no lo incluyas.
- No inventes productos que no estén en la lista B.`;
}
function vComparativa(desde){
  const eqs = Object.values(S.equivalencias).filter(e => !e.sinCompra && (e.compras || []).length);
  if (!eqs.length) return '';
  const vMap = {}; aggVentas(desde).prods.forEach(p => { vMap[p.key] = p; });
  const cPer = productosCompra(desde), cTodo = productosCompra('');
  const usado = {};
  eqs.forEach(e => { const v = vMap[norm(e.tpv)]; if (!v) return; e.compras.forEach(c => { if (c.rendimiento > 0) usado[c.key] = (usado[c.key] || 0) + v.cantidad / c.rendimiento; }); });
  const claves = Object.keys(usado);
  let h = '';
  if (claves.length){
    h += `<h2>Comprado frente a vendido</h2><p class="note">Cuánto has comprado de cada producto en este periodo y cuánto se ha gastado según las ventas. Si sobra mucho puede ser stock en almacén; si falta, mermas, invitaciones o equivalencias mal ajustadas.</p>`;
    h += tabla(['Producto de compra','Comprado','Gastado en ventas','Diferencia'], claves.sort((a, b) => (usado[b] || 0) - (usado[a] || 0)).map(k => { const p = cPer[k] || cTodo[k] || {nombre:k, unidad:''}; const comp = cPer[k] ? cPer[k].cantidad : 0; const dif = comp - usado[k];
      return [esc(p.nombre), qty(comp) + ' ' + esc(p.unidad || ''), qty(usado[k]) + ' ' + esc(p.unidad || ''), `<span class="badge ${dif < 0 ? 'red' : 'grey'}">${dif >= 0 ? '+' : ''}${qty(dif)}</span>`]; }), [1,2,3]);
  }
  const filas = [];
  eqs.forEach(e => { const v = vMap[norm(e.tpv)]; if (!v || !v.cantidad || !v.importe) return;
    let coste = 0, ok = true; e.compras.forEach(c => { const p = cTodo[c.key]; if (!p || p.precioUnit == null || !(c.rendimiento > 0)) ok = false; else coste += p.precioUnit / c.rendimiento; });
    if (!ok) return; const pv = v.importe / v.cantidad, sinIva = pv / 1.10, mg = sinIva - coste;
    filas.push({n:e.tpv, pv, coste, mg, pct:sinIva ? mg / sinIva * 100 : 0}); });
  if (filas.length){
    h += `<h2>Coste y margen por artículo</h2><p class="note">Precio medio de venta en el TPV y coste de lo que gasta según tus facturas. El margen descuenta el 10% de IVA de la venta.</p>`;
    h += tabla(['Artículo (TPV)','Precio venta','Coste','Margen'], filas.sort((a, b) => b.mg - a.mg).map(f => [esc(f.n), money(f.pv), money(f.coste), money(f.mg) + ' (' + Math.round(f.pct) + '%)']), [1,2,3]);
  }
  return h;
}

/* ===== La factura sustituye a sus albaranes (pasa lotes, caducidades y fotos de envase) ===== */
function borrarFoto(ref){
  if (!ref || !String(ref).startsWith('idb:')) return;
  const id = ref.slice(4); IDB.del('fotos', id).catch(() => {});
  if (FOTOURL[id]){ try { URL.revokeObjectURL(FOTOURL[id]); } catch(e){} delete FOTOURL[id]; }
  if (fbActivo() && !id.startsWith('o_')) FB.mod.deleteDoc(FB.mod.doc(fbCol('fotos'), id)).catch(() => {});
}
function parecido(a, b){
  if (!a || !b) return false; if (a === b || a.includes(b) || b.includes(a)) return true;
  const ta = a.split(' ').filter(w => w.length > 2), tb = new Set(b.split(' ').filter(w => w.length > 2));
  if (!ta.length || !tb.size) return false;
  const comunes = ta.filter(w => tb.has(w)).length; return comunes / Math.min(ta.length, tb.size) >= 0.6;
}
function albaranesDeFactura(fid){
  const f = S.documentos[fid]; if (!f || f.tipo !== 'factura' || !f.proveedorId) return [];
  const cands = Object.entries(S.documentos).filter(([id, d]) => id !== fid && d.tipo === 'albaran' && d.proveedorId === f.proveedorId);
  if (!cands.length) return [];
  const refs = Array.isArray(f.albaranes) ? f.albaranes : [];
  const nums = refs.map(r => normNum(r && r.numero)).filter(n => n && n.length >= 3);
  const fechas = new Set(refs.map(r => r && r.fecha).filter(validIso));
  let m = [];
  if (nums.length) m = cands.filter(([, d]) => { const n = normNum(d.numero); return n && nums.some(x => x === n || (x.length >= 5 && n.length >= 5 && (x.endsWith(n) || n.endsWith(x)))); });
  if (!m.length && fechas.size) m = cands.filter(([, d]) => fechas.has(d.fecha) && (!validIso(f.fecha) || d.fecha <= f.fecha));
  if (!m.length && f.total != null){
    const t = cands.filter(([, d]) => d.total != null && Math.abs(d.total - f.total) < 0.02 && (!validIso(f.fecha) || !validIso(d.fecha) || (d.fecha <= f.fecha && diffDays(pd(d.fecha), pd(f.fecha)) <= 62)));
    if (t.length === 1) m = t;
  }
  return m;
}
async function sustituirAlbaranes(fid, silencio){
  const m = albaranesDeFactura(fid); if (!m.length) return 0;
  const f = JSON.parse(JSON.stringify(S.documentos[fid])); f.lineas = f.lineas || []; f.incluye = f.incluye || [];
  const fotosABorrar = [];
  for (const [, a] of m){
    for (const l of (a.lineas || [])){
      if (!(l.lote || validIso(l.caducidad) || l.fotoEnvase || l.agotado)) continue;
      const k = norm(l.producto);
      const dest = f.lineas.find(x => !x.deAlbaran && !x.lote && !x.fotoEnvase && !validIso(x.caducidad) && parecido(norm(x.producto), k));
      if (dest){
        dest.lote = l.lote || ''; if (validIso(l.caducidad)) dest.caducidad = l.caducidad;
        if (l.fotoEnvase) dest.fotoEnvase = l.fotoEnvase; if (l.fotoEnvaseBorrada) dest.fotoEnvaseBorrada = l.fotoEnvaseBorrada;
        dest.agotado = !!(dest.agotado || l.agotado); if (validIso(a.fecha)) dest.fechaCompra = a.fecha;
      } else {
        f.lineas.push({producto:l.producto, cantidad:l.cantidad ?? null, unidad:l.unidad || '', precio:null, importe:null, lote:l.lote || '', caducidad:validIso(l.caducidad) ? l.caducidad : '', fotoEnvase:l.fotoEnvase || '', agotado:!!l.agotado, deAlbaran:true, fechaCompra:validIso(a.fecha) ? a.fecha : (l.fechaCompra || '')});
      }
    }
    f.incluye.push({numero:a.numero || '', fecha:a.fecha || '', total:a.total ?? null});
    fotosABorrar.push(...(a.fotos || []), ...(a.fotosOrig || []).filter(Boolean));
  }
  f.actualizado = Date.now();
  await Store.save('documentos', fid, f);
  for (const [aid] of m) await Store.del('documentos', aid);
  fotosABorrar.forEach(borrarFoto);
  if (!silencio) setTimeout(() => toast('Albarán' + (m.length > 1 ? 'es' : '') + ' ' + m.map(([, a]) => 'nº ' + (a.numero || 's/n')).join(', ') + ' sustituido' + (m.length > 1 ? 's' : '') + ' por la factura ' + (f.numero || '') + '. Lotes y caducidades pasados a la factura.', 7000), 1500);
  return m.length;
}
// Al guardar un albarán, por si su factura ya estaba guardada
async function buscarFacturaDeAlbaran(aid){
  const a = S.documentos[aid]; if (!a || a.tipo !== 'albaran') return;
  for (const [fid, f] of Object.entries(S.documentos)) if (f.tipo === 'factura' && f.proveedorId === a.proveedorId && albaranesDeFactura(fid).some(([id]) => id === aid)){ await sustituirAlbaranes(fid); return; }
}
function promptRefsAlbaranes(n){
  return `Te paso ${n} foto${n === 1 ? '' : 's'} de una FACTURA de proveedor. Busca los albaranes que incluye (por ejemplo «Albarán nº», «Doc. Nº», «Nota de entrega», con su fecha).
Responde SOLO con un objeto JSON: {"albaranes":[{"numero":string|null,"fecha":"AAAA-MM-DD"|null}]}
Si la factura no menciona albaranes, devuelve {"albaranes":[]}. No inventes nada.`;
}
let SUSTITUYENDO = false;
async function sustituirAntiguos(){
  if (SUSTITUYENDO) return; SUSTITUYENDO = true;
  const b = $('#btnSust'); if (b){ b.disabled = true; b.textContent = 'Buscando…'; }
  let total = 0;
  try {
    const facturas = Object.entries(S.documentos).filter(([, d]) => d.tipo === 'factura').sort((x, y) => (x[1].fecha || '').localeCompare(y[1].fecha || ''));
    for (const [fid, f] of facturas){
      if (!S.documentos[fid]) continue;
      const hayAlb = Object.values(S.documentos).some(d => d.tipo === 'albaran' && d.proveedorId === f.proveedorId);
      if (!hayAlb) continue;
      if (!Array.isArray(f.albaranes) && hasKey() && (f.fotos || []).length){
        toast('Leyendo la factura ' + (f.numero || '') + '…', 15000);
        const blobs = []; for (const ref of f.fotos) { const x = await getFotoBlob(ref); if (x) blobs.push(x); }
        if (blobs.length){ const r = await askJSON(promptRefsAlbaranes(blobs.length), blobs, true);
          await Store.save('documentos', fid, {...S.documentos[fid], albaranes:((r && r.albaranes) || []).filter(x => x && (x.numero || x.fecha)).map(x => ({numero:x.numero ? String(x.numero) : '', fecha:validIso(x.fecha) ? x.fecha : ''}))}); }
      }
      total += await sustituirAlbaranes(fid, true);
    }
    toast(total ? 'Listo: ' + total + ' albarán' + (total === 1 ? '' : 'es') + ' sustituido' + (total === 1 ? '' : 's') + ' por su factura.' : 'No se ha encontrado ningún albarán con su factura guardada.', 6000);
  } catch(e){ toast(errMsg(e) + ' Pulsa otra vez para seguir.', 7000); }
  SUSTITUYENDO = false; if ($('#btnSust')) abrirAjustes();
}

/* ===== Fotos de envases: se borran 6 meses después de la compra (o de la caducidad, si es posterior). El lote y la fecha se conservan. ===== */
function sumarMeses(d, n){ const x = new Date(d); const dia = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n); x.setDate(Math.min(dia, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; }
function limiteFotoLote(l, d){
  const compra = validIso(l.fechaCompra) ? l.fechaCompra : d.fecha; if (!validIso(compra)) return null;
  const base = validIso(l.caducidad) && l.caducidad > compra ? l.caducidad : compra;
  return iso(sumarMeses(pd(base), 6));
}
async function limpiarFotosLotes(){
  const hoy = iso(new Date()); if (localStorage.getItem('limpiezaLotes') === hoy) return;
  let n = 0;
  for (const [id, d] of Object.entries(S.documentos)){
    let cambio = false;
    const lineas = (d.lineas || []).map(l => {
      if (!l.fotoEnvase) return l; const lim = limiteFotoLote(l, d); if (!lim || hoy < lim) return l;
      borrarFoto(l.fotoEnvase); cambio = true; n++; return {...l, fotoEnvase:'', fotoEnvaseBorrada:hoy};
    });
    if (cambio) await Store.save('documentos', id, {...d, lineas, actualizado:Date.now()});
  }
  localStorage.setItem('limpiezaLotes', hoy);
  if (n) toast(n + ' foto' + (n === 1 ? '' : 's') + ' de envases antiguas borrada' + (n === 1 ? '' : 's') + ' (el lote y la caducidad se conservan).', 6000);
}
setTimeout(() => { if (LISTO) limpiarFotosLotes(); }, 25000);

/* ===== Actualizaciones automáticas ===== */
let NUEVA = null;
(function(){ const prev = localStorage.getItem('app_version'); if (prev && prev !== APP_VERSION) setTimeout(() => toast('App actualizada a la versión ' + APP_VERSION, 5000), 1500); localStorage.setItem('app_version', APP_VERSION); })();
async function comprobarVersion(){
  if (location.protocol !== 'https:' || /claude|anthropic/.test(location.hostname)) return;
  try {
    const r = await fetch('index.html?v=' + Date.now(), {cache:'no-store'}); if (!r.ok) return;
    const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION && NUEVA !== m[1]){ NUEVA = m[1]; render(); }
  } catch(e){}
}
async function actualizarApp(){
  toast('Actualizando…');
  try { const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch(e){}
  setTimeout(() => location.reload(), 600);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') comprobarVersion(); });
setTimeout(comprobarVersion, 4000);
setInterval(comprobarVersion, 30 * 60 * 1000);

/* ===== Instalación ===== */
let INSTALAR = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALAR = e; render(); });
window.addEventListener('appinstalled', () => { INSTALAR = null; toast('App instalada'); render(); });
async function instalar(){ if (!INSTALAR) return; INSTALAR.prompt(); try { await INSTALAR.userChoice; } catch(e){} INSTALAR = null; render(); }
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* ===== Copia de seguridad ===== */
function descargarBlob(nombre, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function descargar(nombre, texto){ descargarBlob(nombre, new Blob([texto], {type:'application/json'})); }
async function backup(){
  try {
    toast('Preparando la copia…');
    const fotosBlob = await IDB.all('fotos'); const fotos = {};
    for (const [id, b] of Object.entries(fotosBlob)) fotos[id] = await blobToDataURL(b);
    descargar('trazabilidad-' + iso(new Date()) + '.json', JSON.stringify({...S, fotos, version:APP_VERSION}));
  } catch(e){ toast('No se pudo crear la copia'); }
}
function dataURLtoBlob(u){
  const [h, d] = u.split(','); const mime = (h.match(/data:([^;]+)/) || [])[1] || 'image/jpeg';
  const bin = atob(d); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
async function restaurar(){
  const files = await pickFiles({accept:'.json,application/json'}); if (!files.length) return;
  try {
    const data = JSON.parse(await files[0].text());
    if (!confirm('Se añadirán los datos de la copia a los actuales (los que tengan el mismo identificador se sustituyen). ¿Continuar?')) return;
    for (const [id, u] of Object.entries(data.fotos || {})) if (String(u).startsWith('data:')){
      const b = dataURLtoBlob(u); await IDB.put('fotos', id, b);
      if (id.startsWith('o_')) continue;
      if (fbActivo()) await subirFoto(id, b).catch(() => addPend('fotos', id)); else if (leerCfg()) addPend('fotos', id);
    }
    for (const c of COLS) for (const [id, v] of Object.entries(data[c] || {})) await Store.save(c, id, v);
    toast('Copia restaurada');
  } catch(e){ toast('Ese archivo no es una copia válida'); }
}

/* ===== Arranque ===== */
render();
Store.init();
window.APP_OK = true;
